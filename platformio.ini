; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_rts = 0
monitor_dtr = 0

[env:temperature_humidity]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_flags = -DDEPLOYMENT_TEMPERATURE_HUMIDITY
build_src_filter = +<*> -<surf_forecast.cpp>
board_build.filesystem = spiffs
board_build.partitions = default.csv
; Linting configuration
check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --std=c++11 --language=c++
    clangtidy: --checks=*
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.4
    bblanchon/ArduinoJson@^7.0.4

[env:surf_forecast]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_flags = -DDEPLOYMENT_SURF_FORECAST
build_src_filter = +<*> -<temperature_and_humidity.cpp> -<camera_capture.cpp>
board_build.filesystem = spiffs
board_build.partitions = default.csv
; Linting configuration
check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --std=c++11 --language=c++
    clangtidy: --checks=*
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4

[env:camera]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_flags = -DDEPLOYMENT_CAMERA -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<temperature_and_humidity.cpp> -<surf_forecast.cpp> -<datalogger.cpp>
board_build.filesystem = spiffs
board_build.partitions = default.csv
; Linting configuration
check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --std=c++11 --language=c++
    clangtidy: --checks=*
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9

; Default environment (change build_flags to switch deployment mode)
[env:freenove_esp32_wrover]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_flags = -DDEPLOYMENT_TEMPERATURE_HUMIDITY  ; Change this line to switch modes
build_src_filter = +<*> -<surf_forecast.cpp>     ; Exclude surf_forecast.cpp for temp/humidity
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.4
    bblanchon/ArduinoJson@^7.0.4

[env:default]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
build_flags = -DDEPLOYMENT_TEMPERATURE_HUMIDITY  ; Change this line to switch modes
build_src_filter = +<*> -<surf_forecast.cpp>     ; Exclude surf_forecast.cpp for temp/humidity
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.4
    bblanchon/ArduinoJson@^7.0.4
